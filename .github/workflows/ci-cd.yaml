name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  release:
    types: [created]

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest

  deploy-staging:
    needs: build-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy to Staging
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e

          if [ ! -d "flask-app" ]; then
            git clone https://github.com/bharathrm555/github_actions_hvrd flask-app
          fi

          cd flask-app
          git fetch origin
          git reset --hard origin/staging

          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          source venv/bin/activate
          pip install -r requirements.txt

          sudo systemctl restart flask-app

  deploy-production:
    needs: build-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy to Production
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e

          if [ ! -d "flask-app" ]; then
            git clone https://github.com/bharathrm555/github_actions_hvrd flask-app
          fi

          cd flask-app
          git pull origin staging

          python3 -m venv venv
          source venv/bin/activate

          pip install -r requirements.txt

          pkill -f app.py || true

          nohup venv/bin/python app.py > output.log 2>&1 < /dev/null & disown